services:
  - type: web
    name: aisa-inmobiliaria-api
    runtime: node
    branch: main
    rootDir: api-service
    autoDeployTrigger: commit
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://aisa-inmobiliaria.vercel.app
      - key: AISA_API_URL
        value: https://aisa-inmobiliaria-api.onrender.com
      - key: META_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_PROFILE_EMAIL
        value: aisainmobiliaria9@gmail.com
      - key: AISA_PUBLIC_URL
        value: https://aisa-inmobiliaria.vercel.app
      - key: META_CATALOG_ID
        sync: false
      - key: META_CATALOG_ACCESS_TOKEN
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v27.0
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
